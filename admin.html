<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car BNB – Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="logo" href="index.html"
          ><svg
            width="30"
            height="30"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M4 20l2.5-8A3 3 0 019.4 10h13.2a3 3 0 012.9 2l2.5 8v5h-3v-2H7v2H4z"
            />
            <circle cx="9.5" cy="19" r="1" />
            <circle cx="22.5" cy="19" r="1" /></svg
          >carbnb</a
        >
        <nav>
          <a href="index.html">Cars</a><a href="rentals.html">Rented cars</a
          ><a class="on" href="admin.html">Admin</a>
        </nav>
        <button class="btn ghost pill" id="logout" hidden>Log out</button>
      </div>
    </header>
    <main>
      <section id="login" style="max-width: 420px; margin: 40px auto" hidden>
        <h1 style="font-size: 26px; margin-bottom: 16px">Admin log in</h1>
        <form id="loginForm">
          <label
            >Email<input
              name="email"
              type="email"
              required
              autocomplete="username"
          /></label>
          <label
            >Password<input
              name="password"
              type="password"
              required
              autocomplete="current-password"
          /></label>
          <button class="btn block" id="loginBtn">Log in</button>
        </form>
      </section>

      <section id="denied" class="empty" hidden>
        <h2>Not authorized</h2>
        <p>This account is not an admin.</p>
      </section>

      <section id="dash" hidden>
        <div class="hero">
          <h1>Moderation</h1>
          <p>Review listings and bookings. Deleting is permanent.</p>
        </div>
        <nav id="tabs" style="margin: 16px 0 0">
          <a href="#" data-t="cars" class="on">Cars</a
          ><a href="#" data-t="bookings">Bookings</a>
        </nav>
        <div class="table-wrap">
          <table class="data">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
